name: Docker Build and Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
    build-and-push:
      name: Build and Push Docker Image
      runs-on: ubuntu-latest

      steps: 
        - name: Git checkout
          uses: actions/checkout@v7

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{secrets.DOCKERHUB_USERNAME}}
            password: ${{secrets.DOCKERHUB_TOKEN}}

        - name: Build Docker Image
          run: | 
            docker build -f Dockerfile.jlink \
            -t ${{secrets.DOCKERHUB_USERNAME}}/three-tier-app:${{ github.sha }} \
            -t ${{secrets.DOCKERHUB_USERNAME}}/three-tier-app:latest \
            .

        - name: Scan Docker image with Trivy
          uses: aquasecurity/trivy-action@v0.36.0
          with:
            image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/three-tier-app:${{ github.sha }}
            format: table
            exit-code: 1
            ignore-unfixed: true
            vuln-type: os,library
            severity: HIGH,CRITICAL

        - name: push Docker image
          run: | 
            docker push ${{secrets.DOCKERHUB_USERNAME}}/three-tier-app:${{ github.sha }} 
            docker push ${{secrets.DOCKERHUB_USERNAME}}/three-tier-app:latest

        - name: Show Docker Images
          run: |
            docker images