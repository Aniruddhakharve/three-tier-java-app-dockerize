name: DAST Scan

on:
  workflow_dispatch:

jobs:
  dast:
    name: OWASP ZAP DAST
    runs-on: ubuntu-latest

    steps:
      - name: Git Checkout
        uses: actions/checkout@v7

      - name: Build JLink Docker Image
        run: |
          docker build \
            -f Dockerfile.jlink \
            -t three-tier-app:jlink \
            .

      - name: Start Application Container
        run: |
          docker run -d \
            --name three-tier-app \
            -p 8080:8080 \
            three-tier-app:jlink

      - name: Wait for Application
        run: |
          echo "Waiting for application to start..."

          for i in {1..30}; do
            if curl -fsS http://localhost:8080/ > /dev/null; then
              echo "Application is ready!"
              exit 0
            fi

            echo "Waiting... ($i/30)"
            sleep 5
          done

          echo "Application failed to start."
          docker logs three-tier-app
          exit 1

      - name: Run OWASP ZAP Baseline Scan
        run: |
          mkdir -p zap-reports

          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/zap-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:8080 \
            -J /zap/wrk/report_json.json \
            -w /zap/wrk/report_md.md \
            -r /zap/wrk/report_html.html

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report
          path: |
            zap-reports/report_html.html
            zap-reports/report_md.md
            zap-reports/report_json.json
          if-no-files-found: warn

      - name: Show Container Logs
        if: always()
        run: |
          docker logs three-tier-app