name: DAST Scan

on:
  workflow_dispatch:

jobs:
  dast:
    name: OWASP ZAP DAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build JLink Docker Image
        run: |
          docker build \
            -f Dockerfile.jlink \
            -t three-tier-app:jlink \
            .

      - name: Start Application Container
        run: |
          docker run -d \
            --name three-tier-app \
            -p 8080:8080 \
            three-tier-app:jlink

      - name: Wait for Application
        run: |
          echo "Waiting for application to start..."

          for i in {1..30}; do
            if curl -fsS http://localhost:8080/ > /dev/null; then
              echo "Application is ready!"
              exit 0
            fi

            echo "Waiting... ($i/30)"
            sleep 5
          done

          echo "Application failed to start."
          docker logs three-tier-app
          exit 1

      - name: Prepare ZAP Report Directory
        run: |
          mkdir -p "${{ github.workspace }}/zap-reports"
          chmod 777 "${{ github.workspace }}/zap-reports"

      - name: OWASP ZAP Baseline Scan
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/zap-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:8080 \
            -J report_json.json \
            -w report_md.md \
            -r report_html.html \
            -I

      - name: List ZAP Reports
        if: always()
        run: |
          echo "Generated ZAP reports:"
          ls -lah zap-reports/

      - name: Upload ZAP Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report
          path: zap-reports/

      - name: Show Application Logs
        if: always()
        run: |
          docker logs three-tier-app

      - name: Stop Application Container
        if: always()
        run: |
          docker stop three-tier-app || true
          docker rm three-tier-app || true