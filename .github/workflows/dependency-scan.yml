name: Dependency Scan

on:
    workflow_dispatch:

jobs:
    dependency-check:
        name: OWASP Dependency Check
        runs-on: ubuntu-latest

        steps:
            - name: Git Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup Java 17
              uses: actions/setup-java@v5
              with:
                  distribution: 'temurin'
                  java-version: '17'
                  cache: maven

            - name: Get Cache Date
              id: cache-date
              run: |
                  echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

            - name: Restore OWASP Dependency Check Cache
              id: dependency-check-cache
              uses: actions/cache/restore@v4
              with:
                  path: ~/.m2/repository/org/owasp/dependency-check-data
                  key: dependency-check-${{ runner.os }}-${{ steps.cache-date.outputs.date }}
                  restore-keys: |
                      dependency-check-${{ runner.os }}-

            - name: Run OWASP Dependency Check
              env:
                NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
              run: |
                    mvn --batch-mode org.owasp:dependency-check-maven:12.1.0:check \
                    -Dformat=ALL \
                    -DfailBuildOnCVSS=7 \
                    -DnvdApiKeyEnvironmentVariable=NVD_API_KEY 

            - name: Save OWASP Dependency Check Cache
              if: always() && steps.dependency-check-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@v4
              with:
                  path: ~/.m2/repository/org/owasp/dependency-check-data
                  key: dependency-check-${{ runner.os }}-${{ steps.cache-date.outputs.date }}

            - name: Upload Dependency Check Report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: dependency-check-report
                  path: |
                      target/dependency-check-report.html
                      target/dependency-check-report.json
                      target/dependency-check-report.xml

