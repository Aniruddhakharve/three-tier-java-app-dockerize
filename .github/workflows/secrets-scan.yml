name: Secret Scan

on:
#   workflow_run:
#     workflows: ["Code Quality"]
#     types:
#       - completed
#     branches: [ main]
  workflow_dispatch:

jobs:
    gitleaks:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source code
              uses: actions/checkout@v7
              with:
                fetch-depth: 0
            
            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v3
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}